        \"array\",\n                                    \"items\": {\n                                        \"$ref\":
        \"#/components/schemas/Pet\"\n                                    }\n                                }\n                            }\n                        }\n                    },\n                    \"400\":
        {\n                        \"description\": \"Invalid status value\"\n                    }\n                },\n                \"security\":
        [\n                    {\n                        \"petstore_auth\": [\n                            \"write:pets\",\n                            \"read:pets\"\n                        ]\n                    }\n                ]\n            }\n        },\n        \"/pet/findByTags\":
        {\n            \"get\": {\n                \"tags\": [\n                    \"pet\"\n                ],\n                \"summary\":
