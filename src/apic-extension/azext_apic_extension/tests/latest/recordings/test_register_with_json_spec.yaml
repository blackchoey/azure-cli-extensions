        \"createUsersWithListInput\",\n                \"requestBody\": {\n                    \"content\":
        {\n                        \"application/json\": {\n                            \"schema\":
        {\n                                \"type\": \"array\",\n                                \"items\":
        {\n                                    \"$ref\": \"#/components/schemas/User\"\n                                }\n                            }\n                        }\n                    }\n                },\n                \"responses\":
