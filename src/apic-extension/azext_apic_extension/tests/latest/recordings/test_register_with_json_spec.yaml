        \"#/components/schemas/User\"\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n        },\n        \"/user/createWithList\":
        {\n            \"post\": {\n                \"tags\": [\n                    \"user\"\n                ],\n                \"summary\":
