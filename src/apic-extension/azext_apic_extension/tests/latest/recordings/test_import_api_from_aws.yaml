      string: '{"type":"Microsoft.ApiCenter/services/workspaces/apis","properties":{"title":"Swagger
        Petstore","summary":"A sample API that uses a petstore as an example to demonstrate
        features in the OpenAPI Specification.","description":"The Swagger Petstore
